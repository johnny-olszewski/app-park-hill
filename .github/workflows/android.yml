# Android CI (AND-004, AND-007): mock unit and UI tests, no build-variant
# branching, and no mock code in the release build. Mock only; Dev tests run locally (guide 6).
# Reports only; guide 7.1 rule 10 forbids merging red.
name: Android

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "android/**"
      - "contract/**"
      - "backend/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: No build-variant branching
        run: scripts/check_sources.sh

      - name: Unit tests (mock and dev)
        run: ./gradlew --console=plain testMockDebugUnitTest testDevDebugUnitTest

      - name: Build the dev variants
        run: ./gradlew --console=plain assembleDevDebug assembleDevRelease

      - name: No mock code in the release build
        run: scripts/check_release_apk.sh app/build/outputs/apk/dev/release/app-dev-release-unsigned.apk

  # AND-007: the mock UI tests on an emulator. No backend (guide 6).
  android-ui:
    name: Android mock UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Mock UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --console=plain connectedMockDebugAndroidTest

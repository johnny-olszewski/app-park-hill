# Android CI (AND-004, AND-007): the merge gate in mock (unit tests and the smoke
# instrumented tests in android/smoke-mock.txt), no build-variant branching, and
# no mock code in the release build. Every instrumented test runs nightly
# (nightly.yml); local ones are compiled here (guide 6, 7.2 rule 4).
# Reports only; guide 7.1 rule 10 forbids merging red.
name: Android

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "android/**"
      - "contract/**"
      - "backend/**"
      - "scripts/smoke_tests.sh"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: No build-variant branching
        run: scripts/check_sources.sh

      - name: Unit tests (mock and local)
        run: ./gradlew --console=plain testMockDebugUnitTest testLocalDebugUnitTest

      - name: Build the local variants
        run: ./gradlew --console=plain assembleLocalDebug assembleLocalRelease

      # Local instrumented tests need a backend to run, but compiling them needs none.
      - name: Build the local instrumented tests
        run: ./gradlew --console=plain assembleLocalDebugAndroidTest

      - name: No mock code in the release build
        run: scripts/check_release_apk.sh app/build/outputs/apk/local/release/app-local-release-unsigned.apk

  # AND-007: the smoke mock UI tests on an emulator. No backend (guide 6).
  android-ui:
    name: Android mock UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Mock UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: make test-smoke

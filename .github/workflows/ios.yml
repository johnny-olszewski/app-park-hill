# iOS CI (IOS-004, IOS-007): the merge gate in Mock (unit tests and the smoke UI
# tests in ios/smoke-mock.txt), no build-configuration branching, and no mock or
# dev tools code in the release build. Every UI test runs nightly (nightly.yml);
# Local tests are compiled here and run locally (guide 6, 7.2 rule 4). Runs on ready PRs only, to stay within the free macOS minutes;
# reports only, guide 7.1 rule 10 forbids merging red.
name: iOS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ios/**"
      - "contract/**"
      - "backend/**"
      - "scripts/smoke_tests.sh"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS checks
    if: github.event.pull_request.draft == false
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      # Same version as ios/Makefile.
      - name: Install XcodeGen 2.46.0
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the project
        run: make project

      - name: No build-configuration branching
        run: scripts/check_sources.sh

      - name: Mock unit and smoke UI tests
        run: make test-smoke

      # Local tests need a backend to run, but compiling them needs none.
      - name: Build the Local tests
        run: xcodebuild -scheme ParkHill-Local -destination "id=$(scripts/simulator.sh)" build-for-testing

      # Fresh derived data, so the log lists every compiled source.
      - name: Build the Local release
        run: |
          xcodebuild -scheme ParkHill-Local -configuration Local-Release \
            -destination "id=$(scripts/simulator.sh)" -derivedDataPath "$RUNNER_TEMP/release" build \
            | tee "$RUNNER_TEMP/release-build.log"

      - name: No mock or dev tools code in the release build
        run: |
          scripts/check_release_build_log.sh "$RUNNER_TEMP/release-build.log"
          scripts/check_release_binary.sh "$RUNNER_TEMP/release/Build/Products/Local-Release-iphonesimulator/ParkHill.app"

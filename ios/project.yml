# XcodeGen spec. Generate the project with `make project`; the .xcodeproj is
# not committed. Build settings live in Config/*.xcconfig, not here.
name: ParkHill

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# One debug configuration per environment, plus a release configuration for
# each environment that can ship. Mock never ships, so it has no release.
configs:
  Mock-Debug: debug
  Dev-Debug: debug
  Dev-Release: release

configFiles:
  Mock-Debug: Config/Base.xcconfig
  Dev-Debug: Config/Base.xcconfig
  Dev-Release: Config/Base.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3

targets:
  ParkHill:
    type: application
    platform: iOS
    sources:
      - path: ParkHill
      # Contract fixtures, bundled for the mock services. App.xcconfig
      # excludes them from every configuration except Mock.
      - path: ../contract/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Mock-Debug: Config/Mock.xcconfig
      Dev-Debug: Config/Dev.xcconfig
      Dev-Release: Config/Dev.xcconfig

  ParkHillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkHillTests
      # Every configuration's tests decode the fixtures.
      - path: ../contract/fixtures
        type: folder
        buildPhase: resources
      # Personas and the local password for integration tests.
      - path: ../contract/seed
        type: folder
        buildPhase: resources
    dependencies:
      - target: ParkHill
    configFiles:
      Mock-Debug: Config/Tests-Mock.xcconfig
      Dev-Debug: Config/Tests-Dev.xcconfig
      Dev-Release: Config/Tests-Dev.xcconfig

schemes:
  ParkHill-Mock:
    build:
      targets:
        ParkHill: all
        ParkHillTests: [test]
    run:
      config: Mock-Debug
    test:
      config: Mock-Debug
      targets: [ParkHillTests]
    profile:
      config: Mock-Debug
    analyze:
      config: Mock-Debug
    archive:
      config: Mock-Debug

  ParkHill-Dev:
    build:
      targets:
        ParkHill: all
        ParkHillTests: [test]
    run:
      config: Dev-Debug
    test:
      config: Dev-Debug
      targets: [ParkHillTests]
    profile:
      config: Dev-Release
    analyze:
      config: Dev-Debug
    archive:
      config: Dev-Release

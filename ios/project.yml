# XcodeGen spec. Generate the project with `make project`; the .xcodeproj is
# not committed. Build settings live in Config/*.xcconfig, not here.
name: ParkHill

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# One debug configuration per environment, plus a release configuration for
# each environment that can ship. Mock never ships, so it has no release.
configs:
  Mock-Debug: debug
  Local-Debug: debug
  Local-Release: release

configFiles:
  Mock-Debug: Config/Base.xcconfig
  Local-Debug: Config/Base.xcconfig
  Local-Release: Config/Base.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.55.3

targets:
  ParkHill:
    type: application
    platform: iOS
    sources:
      - path: ParkHill
      # Backend function names, screen keys and response models, generated from
      # contract/names.json, contract/screens and contract/types. Every
      # configuration compiles every Swift file there, so a new model needs no
      # change here.
      - path: ../contract/generated
        excludes:
          - "*.kt"
      # Mock responses and the persona dataset, bundled for the mock
      # services. App.xcconfig excludes them from every configuration except Mock.
      - path: ../contract/mock_responses
        type: folder
        buildPhase: resources
      - path: ../contract/seed
        type: folder
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
    configFiles:
      Mock-Debug: Config/Mock.xcconfig
      Local-Debug: Config/Local.xcconfig
      Local-Release: Config/Local.xcconfig

  ParkHillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ParkHillTests
      # Every configuration's tests decode the mock responses.
      - path: ../contract/mock_responses
        type: folder
        buildPhase: resources
      # The type of each mock response, for the decoding tests.
      - path: ../contract/responses.json
        buildPhase: resources
      # Personas and the local password for integration tests.
      - path: ../contract/seed
        type: folder
        buildPhase: resources
    dependencies:
      - target: ParkHill
    configFiles:
      Mock-Debug: Config/Tests-Mock.xcconfig
      Local-Debug: Config/Tests-Local.xcconfig
      Local-Release: Config/Tests-Local.xcconfig

  ParkHillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ParkHillUITests
      # Persona credentials and expected backend messages.
      - path: ../contract/seed
        type: folder
        buildPhase: resources
      - path: ../contract/mock_responses
        type: folder
        buildPhase: resources
    dependencies:
      - target: ParkHill
    configFiles:
      Mock-Debug: Config/UITests-Mock.xcconfig
      Local-Debug: Config/UITests-Local.xcconfig
      Local-Release: Config/UITests-Local.xcconfig

schemes:
  ParkHill-Mock:
    build:
      targets:
        ParkHill: all
        ParkHillTests: [test]
        ParkHillUITests: [test]
    run:
      config: Mock-Debug
    test:
      config: Mock-Debug
      targets: [ParkHillTests, ParkHillUITests]
    profile:
      config: Mock-Debug
    analyze:
      config: Mock-Debug
    archive:
      config: Mock-Debug

  ParkHill-Local:
    build:
      targets:
        ParkHill: all
        ParkHillTests: [test]
        ParkHillUITests: [test]
    run:
      config: Local-Debug
    test:
      config: Local-Debug
      targets: [ParkHillTests, ParkHillUITests]
    profile:
      config: Local-Release
    analyze:
      config: Local-Debug
    archive:
      config: Local-Release
